name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; fi
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress; fi
      - run: pip install pillow tzdata
      - name: No local paths in the skill
        run: "! grep -rn '/Users/' skills/ --include='*.md' --include='*.py' --include='*.json'"
      - name: Only documented media (no personal files)
        run: python tests/check_media.py
      - name: Example plan passes the checks
        run: python skills/tiktok-skill/scripts/tt_check.py skills/tiktok-skill/examples/fresh-water/plan.json
      - name: Full pipeline (render, check, fix, video tools, schedule, preview, log)
        run: python tests/run_pipeline.py work
